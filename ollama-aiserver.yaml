networks:
  global-network:
    external: true
  ai_network:
    driver: bridge
    internal: true

volumes:
  ollama_data:
  pg_data:

# --- AI Services ---
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_engine
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai_network
    dns:
      - 8.8.8.8  # Google DNS
      - 1.1.1.1  # Cloudflare DNS
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ai_server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_gateway_service
    restart: unless-stopped
    networks:
      - global-network
      - ai_network
    ports:
      - "8090:8090"
    depends_on:
      - ollama